name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.chk.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: chk
        name: Tag must equal v<version>; pre-releases go to TestPyPI
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
          if echo "$v" | grep -Eq '(a|b|rc|\.dev)[0-9]'; then echo "target=testpypi" >> "$GITHUB_OUTPUT"; else echo "target=pypi" >> "$GITHUB_OUTPUT"; fi
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - name: Smoke test the wheel
        run: python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl && /tmp/w/bin/logbook --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  testpypi:
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  pypi:
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
