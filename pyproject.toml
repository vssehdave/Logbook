[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "getlogbook"
version = "0.0.9"
description = "Commit-anchored shared memory for AI-assisted repos (stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Veertej Sehdave" }]
keywords = ["git", "ai-agents", "dbt", "memory", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
# search by meaning (all-MiniLM-L6-v2 on the CPU) is part of Logbook: one `pip install getlogbook` brings all of it; the model itself (90 MB) is fetched once, by `logbook setup`
dependencies = ["onnxruntime", "tokenizers", "huggingface_hub", "numpy"]

[project.urls]
Homepage = "https://github.com/vssehdave/Logbook"
Issues = "https://github.com/vssehdave/Logbook/issues"

[project.scripts]
logbook = "getlogbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
getlogbook = ["agent/*.md"]
